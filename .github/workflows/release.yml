name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: src/go.mod

      - name: Build with GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: ~> v2
          args: release --snapshot --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Move artifacts to output directory
        run: |
          mkdir -p output
          ls -lR dist
          find dist/synq_linux_amd64_v1 -type f -name "synq" -exec cp {} output/synq \;
          ls -lR output

          if [ ! -f output/synq ]; then
            echo "Error: synq binary not found in dist directory."
            exit 1
          fi
                
      - name: Test Docker Compose
        run: docker compose -f docker-compose.test.yml up

      - name: Clean repo
        run: |
          rm -rf output

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: ~> v2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
